name: Daily pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - run: uv sync

      - name: Restore data from the previous run
        uses: actions/cache@v5
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: dbt deps + parse
        working-directory: dbt
        run: uv run dbt deps && uv run dbt parse

      - name: Advance test clocks by one day
        run: uv run python -m pipeline.run advance

      - name: Run the Dagster job (sync → load → dbt build → export)
        run: uv run dagster job execute -m pipeline.orchestration -j daily_pipeline

      - name: dbt source freshness
        working-directory: dbt
        run: uv run dbt source freshness

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push

      - name: Open an issue if the pipeline failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Daily pipeline failed on $(date -u +%Y-%m-%d)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label pipeline-failure