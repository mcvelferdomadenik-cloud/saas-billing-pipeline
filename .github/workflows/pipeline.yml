name: Daily pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - run: uv sync

      - name: Restore data from the previous run
        uses: actions/cache@v5
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Advance test clocks by one day
        run: uv run python -m pipeline.run advance

      - name: Sync from Stripe
        run: uv run python -m pipeline.run sync

      - name: Load into DuckDB
        run: uv run python -m pipeline.run load

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build

      - name: Export dashboard data
        run: uv run python -m pipeline.run export

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push