name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

      - name: Load fixture data into DuckDB
        run: |
          mkdir -p data
          uv run python -c "from pipeline import load; load.RAW_DIR = load.Path('tests/fixtures/raw'); load.load(load.Path('data/fixture.duckdb'))"

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build --target ci

      - name: Docker build
        run: docker build .