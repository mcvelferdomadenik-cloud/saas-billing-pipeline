name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

      - name: Load fixture data into DuckDB
        run: |
          mkdir -p data
          uv run python -c "from pipeline import load; load.RAW_DIR = load.Path('tests/fixtures/raw'); load.load(load.Path('data/fixture.duckdb'))"

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build --target ci

      - name: Docker build
        run: docker build .