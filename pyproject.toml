[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark", email = "mcvelferdomadenik@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "stripe>=15.5.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kaleido>=1.4.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
